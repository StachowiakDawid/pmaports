# /etc/tar1090/lighttpd.conf - standalone lighttpd instance for tar1090
# (tar1090-web.service; runs as user tar1090, no root, no pid file).
# Port and decoder directory come from /etc/default/tar1090.
#   http://<host>:8504/            tar1090 map
#   http://<host>:8504/data/aircraft.json   decoder JSON
#   http://<host>:8504/skyaware/   dump1090-fa's own (lighter) map, if installed

server.modules = ( "mod_alias", "mod_redirect", "mod_setenv", "mod_deflate" )

var.srcdir = env.TAR1090_SRC_DIR
server.port = env.TAR1090_PORT
server.bind = "0.0.0.0"
server.document-root = "/usr/share/tar1090/html"
# no server.errorlog: lighttpd -D logs to stderr = the journal
server.follow-symlink = "enable"
server.max-connections = 64
server.max-fds = 256
index-file.names = ( "index.html" )
mimetype.assign = (
  ".html" => "text/html", ".css" => "text/css", ".js" => "application/javascript",
  ".json" => "application/json", ".geojson" => "application/json", ".gz" => "application/gzip",
  ".png" => "image/png", ".svg" => "image/svg+xml", ".ico" => "image/x-icon",
  ".gif" => "image/gif", ".jpg" => "image/jpeg", ".webp" => "image/webp",
  ".woff" => "font/woff", ".woff2" => "font/woff2", ".ttf" => "font/ttf",
  ".txt" => "text/plain", ".md" => "text/plain", ".zst" => "application/zstd",
  "" => "application/octet-stream",
)

deflate.mimetypes = ( "text/html", "text/css", "application/javascript", "text/javascript", "application/json" )
deflate.allowed-encodings = ( "gzip" )

url.redirect += ( "^/skyaware$" => "/skyaware/" )

alias.url += (
  "/skyaware/data/" => srcdir + "/",
  "/skyaware/" => "/usr/share/dump1090/html/",
  "/data/" => srcdir + "/",
  "/chunks/" => "/run/tar1090/",
)

# --- from upstream 88-tar1090.conf (instance at the web root) ---
$HTTP["url"] =~ "^/chunks/chunk_.*gz$" {
    setenv.add-response-header += (
        "Access-Control-Allow-Origin" => "*",
        "Cache-Control" => "public, max-age=1209600",
        "Content-Encoding" => "gzip",
        )
    setenv.set-response-header = ( "Content-Type" => "application/json" )
}
$HTTP["url"] =~ "^/chunks/current_.*gz$" {
    setenv.add-response-header += (
        "Access-Control-Allow-Origin" => "*",
        "Cache-Control" => "no-cache",
        "Content-Encoding" => "gzip",
        )
    setenv.set-response-header = ( "Content-Type" => "application/json" )
}
$HTTP["url"] =~ "^/(skyaware/)?data/aircraft\.json$" {
    setenv.add-response-header += ( "Cache-Control" => "no-cache" )
}
$HTTP["url"] =~ "^/(images|flags|libs)" {
    setenv.add-response-header += ( "Cache-Control" => "public, max-age=1209600" )
}
$HTTP["url"] =~ "^/config.js$" {
    setenv.add-response-header += ( "Cache-Control" => "no-cache" )
}
$HTTP["url"] =~ "^/(?!config)[^/]*\.js$" {
    setenv.add-response-header += ( "Cache-Control" => "public, max-age=1209600" )
}
# the aircraft database files are stored gzip-compressed
$HTTP["url"] =~ "^/db-.*\.js$" {
    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/style.css$" {
    setenv.add-response-header += ( "Cache-Control" => "public, max-age=1209600" )
}
