# /etc/sdr-record/ism-iq.conf - example profile: 10 minutes of IQ around
# 433.92 MHz from the RTL-SDR (1.024 MS/s, 8 bit: ~1.2 GB).
#   one-off:    systemctl start sdr-record@ism-iq
#   scheduled:  systemctl enable --now sdr-record@ism-iq.timer   (daily 03:00,
#               change with `systemctl edit sdr-record@ism-iq.timer`)
TYPE=iq
# SoapySDR device args: driver=rtlsdr[,serial=...] | driver=limesuiteng
DEVICE=driver=rtlsdr
FREQ=433.92M
RATE=1.024M
# auto (AGC) or dB
GAIN=auto
# auto = the device's native format (rtlsdr: cs8, LimeSDR: cs16); cs8 | cs16 | cf32
FORMAT=auto
DURATION=10m
#BANDWIDTH=
#ANTENNA=
#PPM=0
#BUSY_POLICY=preempt
