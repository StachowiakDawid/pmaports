# /etc/sdr-record/lime-iq.conf - example profile: 60 s of IQ from the LimeSDR
# Mini 2.0 (5 MS/s CS16 = 1.2 GB). Fails/skips ("busy") while a SoapyRemote
# client is streaming from the LimeSDR.
TYPE=iq
DEVICE=driver=limesuiteng
FREQ=100M
RATE=5M
GAIN=40
FORMAT=cs16
DURATION=60
#ANTENNA=LNAW
#BANDWIDTH=5M
