# /etc/sdr-record/fm-audio.conf - example profile: 10 minutes of broadcast FM
# audio as FLAC (rtl_fm wide FM, 32 kHz mono, ~15-25 MB).
#   systemctl start sdr-record@fm-audio        (or enable sdr-record@fm-audio.timer)
TYPE=audio
# RTL-SDR index or serial
DEVICE=0
FREQ=98.0M
# fm (narrow, 24 kHz) | wbfm | am | usb | lsb
MODE=wbfm
GAIN=auto
DURATION=10m
#SQUELCH=0
#PPM=0
#BUSY_POLICY=preempt
