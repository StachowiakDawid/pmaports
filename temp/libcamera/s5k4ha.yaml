#
# Software-ISP tuning for the beyond2lte front depth Samsung S5K4HA.
# Installed as /usr/share/libcamera/ipa/softisp/s5k4ha.yaml and selected by the
# sensor model name ("s5k4ha"). Same content as s5k3p9.yaml: black level 64 at
# 10 bits (measured on raw frames of this sensor), grey-world AWB, no colour
# matrix and no lens shading table until calibration captures exist.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
      # Near-grey AWB (0013): grey world over low-chroma, mid-brightness pixels
      # only, plain grey world when too few qualify. false = plain grey world.
      neutral: true
  - Adjust:
  - Agc:
      # Exposures of 10 ms and more are whole multiples of the flicker period
      # of the lamps (0021; microseconds: 10000 = 50 Hz mains, 8333 = 60 Hz,
      # 0 = off), the gain makes up for the rest.
      flickerPeriod: 10000
      # The exposure may lengthen the frame up to this (0020; microseconds,
      # 0 = keep the frame length of the sensor mode).
      maxFrameDuration: 33334
...
