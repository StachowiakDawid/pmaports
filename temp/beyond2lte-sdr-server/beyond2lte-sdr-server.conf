# /etc/default/beyond2lte-sdr-server - read by beyond2lte-sdr-server.service
# and beyond2lte-sdr-governor.service.

# SoapySDRServer --bind argument. "0.0.0.0" = all IPv4 interfaces, port 55132.
# Use "[::]" for dual stack, or "192.168.1.50:55132" to pin one interface.
SDR_BIND="0.0.0.0"

# Extra environment for SoapySDR (e.g. debug logging):
#SOAPY_SDR_LOG_LEVEL=DEBUG

# CPUs whose cpufreq policy beyond2lte-sdr-governor.service changes, and the
# governor to set. cpu6-7 = Samsung Mongoose M4 big cluster (cpu@100/101 in the
# DT), cpu4-5 = Cortex-A75, cpu0-3 = Cortex-A55. The CPU affinity of the server
# itself is set in the unit (CPUAffinity=6 7); override with
# `systemctl edit beyond2lte-sdr-server`.
SDR_GOVERNOR_CPUS="6 7"
SDR_GOVERNOR="performance"

# Clients. The
# SoapyRemote client's default socket window on macOS is 16 KiB, which limits
# a stream to ~0.5 MS/s over Wi-Fi. Pass a bigger window (and optionally TCP):
#   stream args:  remote:window=4e6[,remote:prot=tcp]
#   device args:  remote=<phone-ip>,driver=remote,remote:driver=limesuiteng,remote:prot=tcp
# remote:window in *device* args only works with a client carrying
# soapy-sdr-remote patch 0001. Do not set remote:mtu above 1500.
