# /etc/default/rtl-tcp - read by rtl-tcp.service (beyond2lte-sdr-services).
# After a change: sudo systemctl restart rtl-tcp

# Listen address and port. The firewall (51_sdr-services.nft) only lets
# private/link-local source addresses in.
RTL_TCP_ADDRESS="0.0.0.0"
RTL_TCP_PORT="1234"

# Extra rtl_tcp options. Clients normally set frequency, sample rate and gain
# themselves over the protocol; these are only the power-on defaults.
#   -f <Hz>   initial frequency         -s <Hz>  initial sample rate (default 2048000)
#   -g <dB>   gain (0 = auto)           -P <ppm> frequency correction
#   -d <idx|serial>  device             -T       bias tee on (RTL-SDR Blog v3/v4)
#   -D        direct sampling (HF)      -b / -n  buffer counts
RTL_TCP_OPTS=""
