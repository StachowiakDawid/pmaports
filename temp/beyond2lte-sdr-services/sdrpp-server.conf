# /etc/default/sdrpp-server - read by sdrpp-server-lime.service and
# sdrpp-server-rtl.service (beyond2lte-sdr-services-sdrpp).
# After a change: sudo systemctl restart sdrpp-server-lime sdrpp-server-rtl

# Listen address (both instances) and port per instance. 5259 is the SDR++
# default. The firewall only lets private/link-local source addresses in.
SDRPP_ADDRESS="0.0.0.0"
SDRPP_LIME_PORT="5259"
SDRPP_RTL_PORT="5260"

# LimeSuiteNG: 8 x 4 KiB packets per USB transfer (same as beyond2lte-sdr-server)
LIMESUITENG_PACKETS_IN_BATCH=8

# Per-instance state (config.json, written by SDR++ itself) lives in
# /var/lib/sdrpp-server/<lime|rtl>/. Delete config.json there to get the
# packaged defaults back on the next start.
