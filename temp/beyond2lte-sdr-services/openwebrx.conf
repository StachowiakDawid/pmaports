# /etc/default/openwebrx - extra environment for openwebrx.service
# (beyond2lte-sdr-services-openwebrx). After a change:
#   sudo systemctl restart openwebrx
#
# Port and bind address are set in /etc/openwebrx/openwebrx.conf ([web]
# port = 8073); if you change the port, change 51_sdr-services.nft as well.
# Receiver/SDR settings: web UI -> Settings (needs an admin user, see
# `sdr-mode help`), stored in /var/lib/openwebrx/settings.json.

