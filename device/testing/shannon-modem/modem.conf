# /etc/shannon/modem.conf - read by /usr/libexec/shannon/shannon-modem (shell syntax)

# Initial attach APN, sent at every CP power-up.  Without one the CP camps in
# limited service ("emergency only").  Play (26006): internet.  Empty = none.
APN=internet

# yes: the radio may be switched on (default: last state, see below).
# no:  the radio always stays in LPM/airplane mode.
RADIO_ALLOWED=yes

# Mobile data when ModemManager is NOT running (with ModemManager, NetworkManager's gsm
# connection decides).  Later: echo "data on|off" > /run/shannon/ctl, remembered in
# /var/lib/shannon/data.  Interface wwan0, route metric 700 (Wi-Fi stays preferred).
DATA=on

# allow: the system suspends normally with the CP running; the CP wakes it through
#        its mailbox (SMS, calls, data).  block: hold a sleep inhibitor while the
#        modem is up (fallback if suspend misbehaves).
SLEEP=allow

# Runtime control:  echo "radio off" > /run/shannon/ctl   (radio on|off is remembered
# in /var/lib/shannon/radio), echo "get reg" > /run/shannon/ctl; log: journalctl -u shannon-modem
# Received SMS (raw PDUs, root only): /var/lib/shannon/sms-inbox.txt

# yes: after a CP crash, restart the CP once without rebooting the phone
# (kernel r137+: s5000ap-load.py restart); no: power it off and wait
# for a reboot.
CP_RESTART=yes

# VoLTE (IMS voice, experimental).  Read by shannon-modemd.
#   no:       nothing happens unless "ims ..." is written to /run/shannon/ctl (default)
#   register: on LTE with network VoLTE support, bring up the IMS PDN and REGISTER
#             without the MMTel tag (calls and SMS stay on CS)
#   mmtel:    as register, with the MMTel tag: calls go over VoLTE while registered,
#             CS (CSFB) otherwise; emergency calls and SMS always stay on CS
# Play (26006): live-verified 2026-11-21 (MO + MT, also after 16 min of sleep)
VOLTE=mmtel
# netdev of the IMS PDN (cid 2): wwan1 = WWAN link 1 = SIPC channel 11 (needs
# kernel support for WWAN link 1 in s5000ap-boot)
#IMS_NETDEV=wwan1
#IMS_LINK_ID=1
# SIM application for IMS AKA: auto (ISIM, then USIM) | isim | usim
#IMS_AKA_APP=auto
# Play: 6 offers make the initial REGISTER 1608 B, sent as UDP fragments that get no answer
IMS_SEC_ALGS="hmac-sha-1-96/aes-cbc hmac-sha-1-96/null hmac-md5-96/null"
#IMS_USER_AGENT="SM-G975F Samsung IMS 6.0"
# sip: sip:+48..@domain;user=phone, tel: tel:+48..; national numbers get phone-context
#IMS_URI_FORMAT=sip
# auto: offer without QoS preconditions, retry with them on 421; yes: always
#IMS_PRECONDITION=auto
# redacted SIP trace (identities, keys and addresses removed), root only
#IMS_TRACE=/run/shannon/ims-trace.txt
# echo cancellation for VoLTE calls (media on the AP): no | speex (needs speexdsp);
# the filter tail must cover playback + capture latency (ms)
# speexdsp echo canceller in the VoLTE media, kept by the user 2026-11-21
IMS_AEC=speex
#IMS_AEC_TAIL_MS=300

# Screen-off idle policy: with the screen off, lower the AP->CP
# PDA_ACTIVE bit so the CP stops waking the phone with signal/registration reports
# (needs kernel r148+, attribute pda_active).  no: only the screen state is sent.
# At run time: echo "idle on|off|status" > /run/shannon/ctl
IDLE=no
