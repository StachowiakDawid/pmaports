# Samsung Galaxy S10+ (beyond2lte): processed microphone source.
#
# The internal DMICs already run at the maximum codec gain (MicDigitalGain 191,
# +31.5 dB); normal speech records at about -24 dBFS rms, which sounds quiet.
# More hardware gain would clip, so this adds a WebRTC voice-processing source
# (adaptive digital gain control, noise suppression, high-pass filter) next to
# the raw source.
#
# Echo reference: deliberately NOT connected, so echo cancellation is inactive
# (the canceller sees a silent reference). monitor.mode avoids the extra "echo
# cancel sink" that would sit in front of the speaker/earpiece routing. But linking
# the reference to a sink monitor (Speaker sink or the multimedia role loopback)
# put the whole playback chain, including hw:S10,1 and the speaker amp, into the
# running graph whenever the source was recorded, even with node.passive = true or
# "in" (pw-top: hw_S10_1 running as a follower of the mic with xruns, cs35l41
# calibration on every recording; tested 2026-11-19). node.autoconnect = false on
# the reference stream keeps the playback side suspended. AGC, noise suppression
# and high-pass still work without a reference.
#
# Default source: the processed source gets priority.session 2050, above the raw
# internal microphones (2000), so recorder apps use it automatically. The raw
# source stays available ("Built-in Audio Internal Microphones") for apps or users
# that want unprocessed audio.
#
# Property names checked against pipewire 1.6.11 (aec-webrtc built against
# webrtc-audio-processing-2: webrtc.gain_control, webrtc.noise_suppression,
# webrtc.high_pass_filter, webrtc.mobile_mode).
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            monitor.mode   = true
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.gain_control      = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter  = true
                webrtc.mobile_mode       = false
            }
            capture.props = {
                node.name        = "beyond2lte.voice-mic.capture"
                node.description = "Microphone (voice processing) input"
                target.object    = "alsa_input.platform-sound.HiFi__Mic__source"
            }
            source.props = {
                node.name        = "beyond2lte.voice-mic"
                node.description = "Microphone (voice processing)"
                priority.session = 2050
            }
            sink.props = {
                node.name        = "beyond2lte.voice-mic.reference"
                node.description = "Microphone (voice processing) echo reference"
                node.passive     = true
                node.autoconnect = false
            }
        }
    }
]
