# Galaxy S10+ (beyond2lte): let the greeter's feedbackd (phrog/phosh greeter,
# runs as greetd) open the notification LED. 72-feedbackd.rules gives the LED
# sysfs attributes to group feedbackd; without this the greeter's feedbackd logs
# "Failed to setup brightness ... Permission denied" (7x when it stops).
m greetd feedbackd
