# Galaxy S10+ (beyond2lte) kernel command line additions.
# Installed to /usr/lib/kernel-cmdline.d/; boot-deploy (via
# generate-kernel-cmdline) puts these into /boot/loader/entries/pmos.conf on
# every deploy, so they survive kernel upgrades. Local overrides go into
# /etc/kernel-cmdline.d/*.conf (same format), followed by `sudo mkinitfs`.

# PSCI C2 idle hangs at ~1.27 s once the charger probes (found by
# bisect). Keep cpuidle off until s2idle3/C2 is validated.
cpuidle.off=1

# SysMMU_AUD (the only exynos-sysmmu in our DT, in front of the ABOX audio DSP): log an
# unhandled page fault instead of panicking. The Calliope firmware's VSS faults are gone since
# r13 (zeroed VSS mapping) and r15 loads show none, but a stray DSP access must not reboot a
# phone that now loads the ABOX driver at every boot. (A fault handler in the driver is not
# possible: the device uses the default DMA domain.)
exynos_iommu.panic_on_fault=0

# USB 3 SuperSpeed on the USB-C gadget port (combo PHY lanes). Works since kernel r20: SS-first
# HS pull-up hold + vendor GUSB3PIPECTL bits, fallback to high-speed when the host does not
# address the SS device, SS re-armed on every attach.
# Measured 1.95 Gbit/s phone->host, 829 Mbit/s host->phone (iperf3 over NCM).
# Rollback: copy this file to /etc/kernel-cmdline.d/50-device-samsung-beyond2lte.conf (a same-named
# /etc file replaces this one) without this line, then sudo mkinitfs -> USB 2.0 only.
phy_exynos5_usbdrd.exynos9820_ss=1

# Display takeover (default since 3-r14, see modprobe.conf): CMA holds phoc's 2-3 scanout buffers
# (17.1 MiB each; the default 60 MiB CMA is tight). 256M since 3-r45 for the cameras: the CSIS capture
# buffers come from CMA, 4 x 31.9 MB for the 4608x3456 ultra-wide (4 x 24.4 MB at 4032x3024) on top of
# ~37 MB in use after boot. Was cma=128M; rollback with
# a /etc/kernel-cmdline.d/50-device-samsung-beyond2lte.conf copy of this file with cma=128M.
cma=256M

# s2idle (kernel r34+): keep the AUD power domain on during system sleep. With AUD powered off, long
# (10 min) s2idle runs left the max77705 I2C bus (fuel gauge/charger/USB-C) returning garbage until a
# reboot. Drop this line once that is fixed.
exynos_pm_domains.sleep_on=AUD

# Wi-Fi PCIe link (BCM4375): ASPM L1 substates. Awake screen-off idle 287 -> 268 mA, Wi-Fi stays up
# (2026-11-18). Rollback: pcie_aspm.policy=default in /etc/kernel-cmdline.d.
pcie_aspm.policy=powersupersave
