# Galaxy S10+ (beyond2lte): modules that must not autoload yet.
# Installed to /usr/lib/modprobe.d/ (read by kmod/udev). `modprobe X` by hand
# still works for blacklisted modules.

# Bluetooth works since U-Boot r8 (BT UART under its USIv2 wrapper, bt5) - hci_uart no longer blacklisted.

# Audio (works since kernel r15 + U-Boot with the ABOX DT): no blacklist any more.
# All modules autoload from their modaliases (exynos9820-abox: of samsung,exynos9820-abox; amps:
# of cirrus,cs35l40 on i2c; codec: platform cs47l92-codec from the madera MFD; machine: of
# samsung,beyond-madera). The machine driver defers until the ABOX DAIs, the codec and both amps
# exist; the softdep only saves deferred-probe rounds when it is loaded first. The ABOX firmware
# comes from firmware-samsung-beyond2lte-stock-audio (/usr/lib/firmware/abox).
softdep snd_soc_beyond_madera pre: snd_soc_exynos9820_abox snd_soc_cs47l92 snd_soc_cs35l41_i2c

# CS35L40 speaker protection DSP (kernel r80+, 0189; UCM Speaker device):
# cal_apply=1 writes CAL_R 8580 / ambient 23 / CAL_STATUS 1 (Samsung's no-calibration defaults)
# after every DSP start, like the stock driver; hibernate=0 keeps a running DSP out of hibernate
# at runtime suspend (stock never hibernates it, unknown whether the 2018 firmware supports it).
# Both only act while a DSP runs, so they are no-ops without the firmware. Tested by hand
# 2026-11-18: HALO_STATE 2, heartbeat, calibration line on every start.
# Factory calibration of this phone (sec_efs cirrus/): rdc_cal_r 8411 = right amp (bottom
# speaker), rdc_cal 8182 = left amp (earpiece), temp_cal 31 (shared); per-amp values need
# kernel r86+ (0192), older kernels use cal_rdc for both. The earpiece DSP only runs if a
# UCM route uses it (stock: stereo-speaker mode only, calls go ASP direct).
# Rollback: SpeakerProtection "off" in the UCM; these options can stay.
options snd_soc_cs35l41 cal_apply=1 hibernate=0 cal_rdc=8411 cal_rdc_right=8411 cal_rdc_left=8182 cal_ambient=31

# BCM4375 Wi-Fi: write the bcmdhd host-capability word, otherwise the firmware never delivers
# tx/rx completions (tested 2026-11-14, 282/244 Mbit/s on 5.58 GHz). Needs kernel r6+.
options brcmfmac pcie_hostcap=-1

# USB-C (max77705-usbc, loads at boot since kernel r9 / device 3-r5): ask for DR_Swap to become USB
# host as PD sink when no USB host enumerated our gadget (safe with a computer as host), OTG VBUS limit 1.5 A for the
# LimeSDR. ds_init=31 (downstream probe opcodes, needed for OTG attach) is the r9 kernel default.
# Verified 2026-11-14: OTG adapter + LimeSDR enumerates with these settings.
# altmode=1 (device 3-r20, kernel r76+): DisplayPort alternate mode on by default (USB-C docks/
# hubs with HDMI/DP; needs U-Boot dp9). The lanes only switch to DP when a DP partner
# enters the mode; chargers, OTG adapters and a cable to a computer are unaffected.
# Rollback: `options max77705_usbc prefer_host=1 otg_ma=1500` in /etc/modprobe.d/*.conf.
options max77705_usbc prefer_host=1 otg_ma=1500 altmode=1

# Display: DECON0 KMS takeover (card "exynos" replaces simpledrm; Phosh, touch, blank/unblank work).
# ON BY DEFAULT since 3-r14 (kernel r28+): verified 2026-11-15 artefact-free under Phosh with
# panel blank_mode=1 (blank = display off only; the sleep-in/sleep-out + re-init path corrupts the
# DDIC state). beyond2lte-display-takeover.service holds greetd until the DECON is
# bound, so phoc never starts on simpledrm and loses its card. CMA: 1440x3040 buffers are 17.1 MiB,
# phoc takes 2-3 -> cma=128M in kernel-cmdline.conf.
# Rollback (back to simpledrm): `options exynos9820_decon enable=0` in /etc/modprobe.d/*.conf and
# reboot, or exynos9820_decon.enable=0 on the kernel cmdline (overrides modprobe.d).
options exynos9820_decon enable=1
# power_off=1 (device 3-r20): every blank (screen off, and so deep sleep) cuts the panel supplies with
# reset asserted; unblank = power on + reset + full init. Saves ~51 mA in deep sleep (75 -> 24 mA)
# and ~40 mA awake with the screen off. Verified 2026-11-18: 16 power cycles,
# picture, brightness, colours and touch normal without replay_bl. Rollback: power_off=0.
options panel_samsung_s6e3ha9 blank_mode=1 power_off=1

# External display: DECON2 drives DisplayPort (second DRM card, phoc adds DP-1 as an extended
# desktop). On by default since 3-r20. Rollback: `options exynos9820_decon2 enable=0`.
options exynos9820_decon2 enable=1

# NFC (S3NRN82, kernel r94+ 0215): the chip needs its clock configuration (FW_CFG) at every
# NCI open or the RF field stays off (RF_DISCOVER slow, CLK_REQ never rises, no tag detected).
# 0x12 = "AP direct 26 MHz PLL" = FW_CFG_CLK_SPEED from the stock libnfc-sec-vendor.conf; the
# Samsung HAL sends exactly this 1 byte at every open on the S3NRN82 (product code 0x82).
# Verified 2026-11-19: after {0x12}, RF_DISCOVER 8 ms, CLK_REQ high, a bank card reads as a Type-4 tag.
options s3fwrn5 fw_cfg=0x12

# Voice calls (kernel r139+, 0281-0283): map the CP's VSS and
# voice parameter regions for the ABOX, so the voice call software of the CP image (VSS) runs on the
# ABOX and plays/records the call audio. The modem loader clears the VSS magic before the CP boots.
# Verified 2026-11-20: VSS starts, clear call audio both ways. Rollback: vss_cp=0 (zeroed stand-ins).
options snd_soc_exynos9820_abox vss_cp=1

# Wi-Fi across system sleep (2026-11-21):
# - feature_disable=0x10 (BRCMF_FEAT_P2P): no p2p-dev-wlan0. Its creation timed out on
#   every re-probe (1.6 s); Wi-Fi Direct is unused.  Rollback: drop it.
# - Keep the BCM4375 powered in deep sleep like stock (needs U-Boot cam18:
#   WLAN_REG_ON pin-con-pdn PREV): only PERST#/link go down, the running firmware
#   resumes (no firmware reload, no re-probe, no 30 s hold).  Rollback:
#   pcie_exynos9820 sleep_off=2 and brcmfmac pcie_warm_resume=0.
options brcmfmac feature_disable=0x10 pcie_warm_resume=1
options pcie_exynos9820 sleep_off=3 resume_repower_ms=100
