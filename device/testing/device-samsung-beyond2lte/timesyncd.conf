# device-samsung-beyond2lte: NTP for the 24/7 SDR server use case.
# Over USB networking the phone has no direct UDP path to the internet (only
# the host's HTTP proxy) - NTP then cannot sync; use `beyond2lte-httptime`
# (sets the clock from an HTTP Date header via $https_proxy) instead.
[Time]
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org time.cloudflare.com
