# device-samsung-beyond2lte: let PID 1 feed a watchdog (24/7 server use).
# systemd uses /dev/watchdog0 if it exists and silently skips this otherwise.
# Today (kernel r6) that is softdog (CONFIG_SOFT_WATCHDOG=y): it reboots on a
# userspace/PID 1 hang but not on a hard kernel lockup. Once the DT gets the
# S3C2410/Exynos hardware watchdog node, the same setting covers
# hard hangs too. Together with boot counting a kernel that keeps hanging
# after userspace start ends up on the known-good fallback by itself.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=3min
