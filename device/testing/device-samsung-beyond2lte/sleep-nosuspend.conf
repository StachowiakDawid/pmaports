# device-samsung-beyond2lte-nosuspend: refuse every sleep state (24/7 server).
# The same subpackage also masks sleep.target/suspend.target/... (symlinks to
# /dev/null in /etc/systemd/system). For the s2idle3 suspend tests remove the
# subpackage: `sudo apk del device-samsung-beyond2lte-nosuspend`.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
