# device-samsung-beyond2lte: when the greeter session ends (login), its compositor
# exits and stevia (Restart=on-failure, 1 s) respawns into the dead display
# ("cannot open display: :0") about 5 times until start-limit-hit, burning CPU
# while the user session starts.  Start/restart only while our compositor's
# Wayland socket exists; a failed ExecCondition skips the start (no restart loop).
# It waits up to 5 s so a slow compositor at login never loses the keyboard.
[Service]
ExecCondition=/bin/sh -c 'i=0; while [ $i -lt 10 ]; do [ -S "$XDG_RUNTIME_DIR/${WAYLAND_DISPLAY:-wayland-0}" ] && exit 0; sleep 0.5; i=$((i+1)); done; exit 1'
