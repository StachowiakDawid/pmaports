# Samsung Galaxy S10+ (beyond2lte): echo-cancelled microphone for calls/VoIP.
#
# Second WebRTC echo-cancel instance next to 60-beyond2lte-voice-mic.conf. Unlike
# the default voice-mic, its echo reference is the Speaker sink monitor (everything
# the bottom speaker and the earpiece amp play, all media roles except ringtone),
# so the canceller removes what the phone itself plays. Not the default source
# (priority 1500 < raw mic 2000 < voice-mic 2050); calls/VoIP apps pick it by name.
#
# Reference linking: node.autoconnect = false here; the WirePlumber script
# beyond2lte-call-mic-reference.lua links the Speaker monitor to the reference
# only while this source is running and unlinks it when it goes idle. A permanent
# link, even paused and passive, merges the mic and the playback PCM (hw:S10,1)
# into one driver group whenever both run for unrelated reasons (e.g. recording
# from the voice-mic while music plays): the follower PCM then resynced ~100 times
# per second and both nodes xrun (tested 2026-11-19). With the dynamic link,
# nothing of this instance runs while it is unused.
#
# While in use the speaker PCM and amps run even if nothing plays (the reference
# pulls the Speaker sink); calls play audio anyway. The merged graph needs:
# node.force-quantum 1024 (= the 1024-frame ALSA period; the default 480-frame
# AEC latency gives quantum 256, at which the follower PCM resyncs constantly) and
# the WirePlumber rules in 61-beyond2lte-call-mic.conf (wireplumber.conf.d):
# hw:S10,1 as driver, 1024 frames headroom on hw:S10,1 and the mic.
#
# AGC off: with gain control the residual echo was boosted after cancellation
# (energy-average echo reduction vs the raw mic -11/-12 dB with AGC, -19 dB
# without, same setup).
# VoIP apps usually run their own AGC.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            monitor.mode   = true
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            node.latency   = 1024/48000
            aec.args = {
                webrtc.gain_control      = false
                webrtc.noise_suppression = true
                webrtc.high_pass_filter  = true
                webrtc.mobile_mode       = false
            }
            capture.props = {
                node.name        = "beyond2lte.call-mic.capture"
                node.description = "Microphone (calls, echo-cancelled) input"
                target.object    = "alsa_input.platform-sound.HiFi__Mic__source"
                node.passive     = true
            }
            source.props = {
                node.name          = "beyond2lte.call-mic"
                node.description   = "Microphone (calls, echo-cancelled)"
                priority.session   = 1500
                node.force-quantum = 1024
            }
            sink.props = {
                node.name        = "beyond2lte.call-mic.reference"
                node.description = "Microphone (calls, echo-cancelled) echo reference"
                node.passive     = true
                node.autoconnect = false
            }
        }
    }
]
