# ALSA UCM2 for the samsung,beyond-madera card (card driver "beyond-madera",
# card name "Samsung Galaxy S10+"): CS47L93 codec on ABOX UAIF0, two CS35L41
# amplifiers (bottom speaker, earpiece) on ABOX UAIF1 (TDM).
# Installed by device-samsung-beyond2lte to
# /usr/share/alsa/ucm2/conf.d/beyond-madera/beyond-madera.conf
Syntax 6

SectionUseCase."HiFi" {
	File "/Samsung/beyond2lte/HiFi.conf"
	Comment "Play HiFi quality Music"
}
