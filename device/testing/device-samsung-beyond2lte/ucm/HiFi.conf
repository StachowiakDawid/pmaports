# Samsung Galaxy S10+ (beyond2lte), mainline beyond-madera machine driver with
# the exynos9820-abox CPU DAIs (kernel r15+, U-Boot with the ABOX DT).
#
# PCMs (one PCM per DAI link, no DPCM):
#   hw:${CardId},0  "HiFi"     ABOX RDMA2 -> UAIF0 -> CS47L93 AIF1 (I2S, 48 kHz, 2 ch)
#                              CS47L93 AIF1 -> UAIF0 -> WDMA1 (capture)
#   hw:${CardId},1  "Speaker"  ABOX RDMA1 -> UAIF1 -> both CS35L41, DSP_A TDM with
#                              4 x 32-bit slots. The machine driver constrains the PCM to
#                              exactly S32_LE (kernel r84+, 0190), 4 channels, i.e. one PCM channel per slot:
#                              ch0 = slot 0 = earpiece amp ("Left", i2c 2-0041)
#                              ch1 = slot 1 = bottom speaker amp ("Right", i2c 2-0040)
#                              ch2/ch3 = unused slots
#
# Speaker and earpiece share hw:${CardId},1, one TDM slot each. PipeWire's ACP
# (like PulseAudio >= 15) makes one sink per UCM device and never puts two
# devices with the same PlaybackPCM into one profile unless both are "split"
# devices (alsa-ucm.c devset_supports_device()). So the old layout (both on one
# route PCM) gave two profiles, "HiFi (Speaker, ...)" and "HiFi (Earpiece, ...)",
# and the Speaker sink had only the [Out] Speaker port.
#
# Speaker/Earpiece layouts:
#  - PipeWire (card opened with "<<<SplitPCM=1>>>", ${var:@SplitPCM} = 1): split
#    devices of the 4-slot hw PCM (PlaybackChannel0 1 / 0, MONO). WirePlumber opens
#    hw:${CardId},1 once (hidden Audio/Sink/Internal node, S32_LE x 4) and adds one
#    mono loopback sink per device -> ONE profile with Speaker and Earpiece sinks.
#  - PulseAudio (no SplitPCM; postmarketOS' default backend) and alsaucm, chosen
#    by the NonSplitLayout define below:
#    "route" (default): beyond_amps route PCM (mono -> slots 0+1), conflicting
#      devices. PulseAudio >= 15 then makes separate profiles "HiFi (Speaker, ...)"
#      and "HiFi (Earpiece, ...)" (one sink per UCM device; two devices on the
#      same PCM never share a profile).
#    "dshare": one dshare PCM per amp (beyond_spk -> slot 1, beyond_rcv -> slot 0),
#      different PCM strings -> ONE profile with both sinks.
# Each device enables only its own amplifier; the idle one gets digital silence.
#
# SPEAKER PROTECTION: when the Cirrus "Protection" firmware
# for the bottom speaker amp is installed (both files below), the Speaker device
# loads it ("Right DSP1 Preload Switch"), feeds the DSP from ASPRX1 and routes
# the amp from the DSP ("Right PCM Source" = DSP), like stock dev-speaker. The
# kernel side needs "options snd_soc_cs35l41 cal_apply=1 hibernate=0"
# (modprobe.conf). Without the firmware the Speaker stays on the ASP route below
# (a DSP route without a running DSP would be silent). Earpiece always ASP, like
# stock dev-handset. Force ASP with SpeakerProtection "off" below.
#
# STEREO SPEAKERS (3-r32, stock dev-dual-speaker): when the left firmware is
# installed too, the Speaker device is a 2-channel sink, FL = earpiece amp
# through its protection DSP (cal_rdc_left), FR = bottom speaker. It then
# conflicts with the Earpiece device (both use slot 0), so PipeWire offers the
# earpiece in a separate profile. Tested 2026-11-19: L/R tones and noise from
# the right transducers. SpeakerStereo "off" = mono bottom speaker as before.
#
# SPEAKER SAFETY: on the ASP route (earpiece always, speaker without firmware)
# the amplifiers take the ASP data directly ("PCM Source" = ASP). Nothing
# limits excursion or coil temperature, so the hardware gain is capped here
# (the DSP route keeps the same caps until listening tests, SpeakerDsp* below):
#   - "Analog PCM Volume" 0 = 0.5 dB, the amplifier's minimum gain
#   - "Digital PCM Volume" fixed below 0 dB (raw = 817 + 8 * dB, 0 = mute)
#   - no PlaybackMixerElem: PipeWire uses software volume, so 100 % in Phosh is
#     full scale into the capped amplifier, never more.
# Raise the caps only after listening tests.

Define {
	# Right (speaker) Digital PCM Volume cap: 721 = -12 dB
	SpeakerDigitalCap "721"
	# Speaker protection: "auto" = DSP route when the firmware is installed,
	# "off" = always ASP (rollback without reinstalling anything)
	SpeakerProtection "auto"
	# set to "1" by If.spkprot below, do not change by hand
	SpeakerDsp "0"
	# Stereo speakers (stock dev-dual-speaker): with the DSP route and the left
	# (earpiece) firmware installed, the Speaker device also drives the earpiece
	# amp through its protection DSP: FL = earpiece (top), FR = bottom speaker,
	# i.e. correct in landscape with the top of the phone on the left.
	# "off" = mono bottom speaker only.
	SpeakerStereo "auto"
	# set to "1" by If.spkprot below, do not change by hand
	SpeakerStereoOn "0"
	# earpiece amp Digital PCM Volume cap in stereo mode (DSP protected)
	SpeakerStereoLeftCap "793"
	# gains on the DSP route; same as the ASP caps until the DSP is verified and
	# the user has listened (then raise, e.g. digital 817 = 0 dB, analog up to 20)
	# 2026-11-19 listening test (kernel r90, DSP running, both speakers, dense speech at full
	# volume): -12/-9/-6/-3 dB all clean -> -3 dB (793). The ASP fallback stays at -12 dB.
	SpeakerDspDigitalCap "793"
	SpeakerDspAnalogGain "0"
	# Left (earpiece) Digital PCM Volume cap: 657 = -20 dB (held at the ear)
	EarpieceDigitalCap "657"
	# HPOUT2 Digital Volume (0.5 dB steps, 128 = 0 dB): 104 = -12 dB
	HeadphoneDigitalCap "104"
	# Speaker/Earpiece layout when the UCM user has no SplitPCM (PulseAudio):
	#   "route"  - 3-r10 layout, verified: one route PCM, Speaker and Earpiece in
	#              separate profiles (switching = profile switch)
	#   "dshare" - one dshare PCM per amp: Speaker and Earpiece as two sinks in
	#              one profile. Unverified on the ABOX
	# PipeWire always uses the SplitPCM layout and ignores this.
	NonSplitLayout "route"
	# capture gains (IN digital volume: 0.5 dB steps, 128 = 0 dB, max 191 = +31.5 dB).
	# 3-r10 left them at 0 dB: in the first PipeWire test, speech near the bottom of
	# the phone peaked at only ~-27 dBFS on ch0 (rms ~-54 dBFS). That is too quiet to hear
	# on playback, if the mic works at all (raw test).
	# DMIC1/DMIC2 (IN3L/IN4L): 191 = +31.5 dB (max). 2026-11-19 tone/speech tests: both mics
	# work (1 kHz tone ~1000x over silence, IN3R/IN4R silent = correct DMIC edge, OSR 3.072 MHz
	# as stock), only ~10 dB less sensitive than expected; speech at +21 dB was barely audible.
	MicDigitalGain "191"
	# headset mic (IN1L): analog PGA 0..31 dB, plus digital
	HeadsetAnalogGain "12"
	HeadsetDigitalGain "140"
}

# Speaker protection firmware present? (UCM Path condition, Syntax 4+.) The
# kernel requests exactly these names (cs35l41 DSP1, fw "spk-prot", system name
# samsung-beyond2lte, amp prefix right); both are needed, the .bin carries the
# tuning. Evaluated when the card is opened: restart PipeWire after installing
# or removing the firmware. This only checks the files; a firmware that fails
# to load or start still gives a silent speaker.
If.spkprot {
	Condition {
		Type String
		String1 "${var:SpeakerProtection}"
		String2 "auto"
	}
	True.If.wmfw {
		Condition {
			Type Path
			Path "/usr/lib/firmware/cirrus/cs35l41-dsp1-spk-prot-samsung-beyond2lte-right.wmfw"
			Mode exist
		}
		True.If.bin {
			Condition {
				Type Path
				Path "/usr/lib/firmware/cirrus/cs35l41-dsp1-spk-prot-samsung-beyond2lte-right.bin"
				Mode exist
			}
			True {
				Define.SpeakerDsp "1"
				If.stereo {
					Condition {
						Type String
						String1 "${var:SpeakerStereo}"
						String2 "auto"
					}
					True.If.lwmfw {
						Condition {
							Type Path
							Path "/usr/lib/firmware/cirrus/cs35l41-dsp1-spk-prot-samsung-beyond2lte-left.wmfw"
							Mode exist
						}
						True.If.lbin {
							Condition {
								Type Path
								Path "/usr/lib/firmware/cirrus/cs35l41-dsp1-spk-prot-samsung-beyond2lte-left.bin"
								Mode exist
							}
							True.Define.SpeakerStereoOn "1"
						}
					}
				}
			}
		}
	}
}

# Non-SplitPCM layout "route" (default, = 3-r10, verified by ear under PulseAudio):
# mono -> slot 0 + slot 1, Speaker/Earpiece conflicting (separate profiles).
LibraryConfig.amps.SubstiConfig.pcm.beyond_amps {
	@args [ CARD DEV ]
	@args {
		CARD.type string
		DEV.type integer
	}
	type route
	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		channels 4
	}
	ttable.0.0 1
	ttable.0.1 1
}

# Non-SplitPCM layout "dshare" (opt-in, NOT verified on the phone): one dshare
# PCM per amplifier on the shared 4-slot hw PCM, so the two devices have different
# PCM strings and PulseAudio puts both into one profile as two sinks. Both
# definitions must have an identical slave block and ipc_key. Period 1024 frames =
# 16 KiB (ABOX cap 32 KiB), buffer 4096 frames = 64 KiB (ABOX max 128 KiB).
LibraryConfig.spk.SubstiConfig.pcm.beyond_spk {
	@args [ CARD DEV ]
	@args {
		CARD.type string
		DEV.type integer
	}
	type dshare
	ipc_key 7239820
	ipc_perm 0666
	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		channels 4
		rate 48000
		period_size 1024
		buffer_size 4096
	}
	# speaker amp = slot 1
	bindings.0 1
}

LibraryConfig.rcv.SubstiConfig.pcm.beyond_rcv {
	@args [ CARD DEV ]
	@args {
		CARD.type string
		DEV.type integer
	}
	type dshare
	ipc_key 7239820
	ipc_perm 0666
	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		channels 4
		rate 48000
		period_size 1024
		buffer_size 4096
	}
	# earpiece amp = slot 0
	bindings.0 0
}

SectionVerb {
	EnableSequence [
		# amplifiers: minimum analog gain, muted until Speaker/Earpiece is enabled.
		# "Right PCM Source" is NOT set here any more: the Speaker device owns the
		# right amp route (DSP or ASP) and the DSP preload. The earpiece amp never
		# uses its DSP (stock dev-handset: Left PCM Source ASP), keep it unloaded.
		cset "name='Left PCM Source' ASP"
		cset "name='Left DSP1 Preload Switch' off"
		# Restore the defaults: a stale Left DSP RX2 = ASPRX1 left by a manual test may
		# have preceded "Left Main AMP Enable(1) failed: -110" on 2026-11-19 (cause not proven).
		cset "name='Left DSP RX1 Source' ASPRX1"
		cset "name='Left DSP RX2 Source' ASPRX2"
		cset "name='Right Analog PCM Volume' 0"
		cset "name='Left Analog PCM Volume' 0"
		cset "name='Right Digital PCM Volume' 0"
		cset "name='Left Digital PCM Volume' 0"
		cset "name='SPEAKER Switch' off"
		cset "name='RECEIVER Switch' off"

		# codec playback: AIF1 RX -> HPOUT2 (3.5 mm jack), muted until enabled
		cset "name='HPOUT2 Digital Switch' off,off"
		cset "name='HPOUT2 Digital Volume' ${var:HeadphoneDigitalCap},${var:HeadphoneDigitalCap}"
		cset "name='HPOUT2L Input 1' AIF1RX1"
		cset "name='HPOUT2R Input 1' AIF1RX2"

		# codec capture: mics run on SYSCLK (FLL1), AIF1 on ASYNCCLK (FLL2 locked
		# to the ABOX BCLK) -> through ASRC1 (rate 1 = SYSCLK side)
		cset "name='ASRC1 Rate 1' SYNCCLK rate 1"
		cset "name='ASRC1 Rate 2' ASYNCCLK rate 1"
		cset "name='IN3L HPF Switch' on"
		cset "name='IN4L HPF Switch' on"
		cset "name='AIF1TX1 Input 1' ASRC1IN1L"
		cset "name='AIF1TX2 Input 1' ASRC1IN1R"
		cset "name='ASRC1IN1L Input 1' None"
		cset "name='ASRC1IN1R Input 1' None"
		cset "name='DMIC1 Switch' off"
		cset "name='DMIC2 Switch' off"
		cset "name='HEADSETMIC Switch' off"
	]
	DisableSequence [
		cset "name='Right Digital PCM Volume' 0"
		cset "name='Left Digital PCM Volume' 0"
		cset "name='SPEAKER Switch' off"
		cset "name='RECEIVER Switch' off"
		cset "name='HPOUT2 Digital Switch' off,off"
		cset "name='HPOUT2L Input 1' None"
		cset "name='HPOUT2R Input 1' None"
		cset "name='AIF1TX1 Input 1' None"
		cset "name='AIF1TX2 Input 1' None"
		cset "name='ASRC1IN1L Input 1' None"
		cset "name='ASRC1IN1R Input 1' None"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
	}
	# Enable/DisableSequence only inside the branches (never also at this level),
	# so no sequence merging is involved. Both branches set the whole right-amp
	# route, whatever alsactl restored from /var/lib/alsa/asound.state.
	If.route {
		Condition {
			Type String
			String1 "${var:SpeakerDsp}"
			String2 "1"
		}
		# protection DSP route (stock dev-speaker)
		True {
			EnableSequence [
				# loads wmfw + bin and boots the DSP (the put waits for the load,
				# ~1 s of I2C); the DSP starts with the stream (DSP1 widget, cal
				# written by cal_apply), pauses after it, stays loaded
				cset "name='Right DSP1 Preload Switch' on"
				cset "name='Right DSP RX1 Source' ASPRX1"
				cset "name='Right DSP RX2 Source' ASPRX1"
				cset "name='Right PCM Source' DSP"
				cset "name='Right Analog PCM Volume' ${var:SpeakerDspAnalogGain}"
				cset "name='Right Digital PCM Volume' ${var:SpeakerDspDigitalCap}"
				cset "name='SPEAKER Switch' on"
			]
			DisableSequence [
				cset "name='SPEAKER Switch' off"
				cset "name='Right Digital PCM Volume' 0"
				cset "name='Right Analog PCM Volume' 0"
				cset "name='Right PCM Source' ASP"
				# stops and powers down the DSP
				cset "name='Right DSP1 Preload Switch' off"
			]
			# stereo: earpiece amp as the second speaker (stock dev-speaker2)
			If.stereo {
				Condition {
					Type String
					String1 "${var:SpeakerStereoOn}"
					String2 "1"
				}
				True {
					ConflictingDevice [
						"Earpiece"
					]
					EnableSequence [
						cset "name='Left DSP1 Preload Switch' on"
						cset "name='Left DSP RX1 Source' ASPRX1"
						cset "name='Left DSP RX2 Source' ASPRX1"
						cset "name='Left PCM Source' DSP"
						cset "name='Left Analog PCM Volume' ${var:SpeakerDspAnalogGain}"
						cset "name='Left Digital PCM Volume' ${var:SpeakerStereoLeftCap}"
						cset "name='RECEIVER Switch' on"
					]
					DisableSequence [
						cset "name='RECEIVER Switch' off"
						cset "name='Left Digital PCM Volume' 0"
						cset "name='Left Analog PCM Volume' 0"
						cset "name='Left PCM Source' ASP"
						cset "name='Left DSP RX2 Source' ASPRX2"
						cset "name='Left DSP1 Preload Switch' off"
					]
				}
			}
		}
		# no firmware (or SpeakerProtection "off"): ASP direct, capped
		False {
			EnableSequence [
				cset "name='Right DSP1 Preload Switch' off"
				cset "name='Right PCM Source' ASP"
				cset "name='Right Analog PCM Volume' 0"
				cset "name='Right Digital PCM Volume' ${var:SpeakerDigitalCap}"
				cset "name='SPEAKER Switch' on"
			]
			DisableSequence [
				cset "name='SPEAKER Switch' off"
				cset "name='Right Digital PCM Volume' 0"
			]
		}
	}
	If.split {
		Condition {
			Type String
			Empty "${var:@SplitPCM}"
		}
		# PulseAudio / alsaucm
		True.If.layout {
			Condition {
				Type String
				String1 "${var:NonSplitLayout}"
				String2 "dshare"
			}
			True.Value {
				PlaybackPCM "beyond_spk:${CardId},1"
				PlaybackChannels 1
			}
			False {
				ConflictingDevice [
					"Earpiece"
				]
				Value {
					PlaybackPCM "beyond_amps:${CardId},1"
					PlaybackChannels 1
				}
			}
		}
		# PipeWire (SplitPCM): split device of the 4-slot hw PCM
		False.If.stereo {
			Condition {
				Type String
				String1 "${var:SpeakerStereoOn}"
				String2 "1"
			}
			True.Value {
				PlaybackPCM "hw:${CardId},1"
				PlaybackChannels 4
				PlaybackChannel0 0
				PlaybackChannelPos0 FL
				PlaybackChannel1 1
				PlaybackChannelPos1 FR
			}
			False.Value {
				PlaybackPCM "hw:${CardId},1"
				PlaybackChannels 4
				PlaybackChannel0 1
				PlaybackChannelPos0 MONO
			}
		}
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	EnableSequence [
		cset "name='Left Digital PCM Volume' ${var:EarpieceDigitalCap}"
		cset "name='RECEIVER Switch' on"
	]
	DisableSequence [
		cset "name='RECEIVER Switch' off"
		cset "name='Left Digital PCM Volume' 0"
	]
	Value {
		PlaybackPriority 50
	}
	If.split {
		Condition {
			Type String
			Empty "${var:@SplitPCM}"
		}
		# PulseAudio / alsaucm
		True.If.layout {
			Condition {
				Type String
				String1 "${var:NonSplitLayout}"
				String2 "dshare"
			}
			True.Value {
				PlaybackPCM "beyond_rcv:${CardId},1"
				PlaybackChannels 1
			}
			False {
				ConflictingDevice [
					"Speaker"
				]
				Value {
					PlaybackPCM "beyond_amps:${CardId},1"
					PlaybackChannels 1
				}
			}
		}
		# PipeWire (SplitPCM): split device of the 4-slot hw PCM
		False.Value {
			PlaybackPCM "hw:${CardId},1"
			PlaybackChannels 4
			PlaybackChannel0 0
			PlaybackChannelPos0 MONO
		}
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='HPOUT2 Digital Switch' on,on"
		cset "name='HEADPHONE Switch' on"
	]
	DisableSequence [
		cset "name='HEADPHONE Switch' off"
		cset "name='HPOUT2 Digital Switch' off,off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "HEADPHONE Jack"
	}
}

# Capture tested 2026-11-19 (arecord and pw-record): DMIC1 -> ch0, DMIC2 -> ch1.
SectionDevice."Mic" {
	Comment "Internal Microphones"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='ASRC1IN1L Input 1' IN3L"
		cset "name='ASRC1IN1R Input 1' IN4L"
		cset "name='IN3L Digital Volume' ${var:MicDigitalGain}"
		cset "name='IN4L Digital Volume' ${var:MicDigitalGain}"
		cset "name='DMIC1 Switch' on"
		cset "name='DMIC2 Switch' on"
	]
	DisableSequence [
		cset "name='DMIC1 Switch' off"
		cset "name='DMIC2 Switch' off"
		cset "name='ASRC1IN1L Input 1' None"
		cset "name='ASRC1IN1R Input 1' None"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='IN1L Mux' B"
		cset "name='IN1L HPF Switch' on"
		cset "name='IN1L Volume' ${var:HeadsetAnalogGain}"
		cset "name='IN1L Digital Volume' ${var:HeadsetDigitalGain}"
		cset "name='ASRC1IN1L Input 1' IN1L"
		cset "name='ASRC1IN1R Input 1' IN1L"
		cset "name='HEADSETMIC Switch' on"
	]
	DisableSequence [
		cset "name='HEADSETMIC Switch' off"
		cset "name='ASRC1IN1L Input 1' None"
		cset "name='ASRC1IN1R Input 1' None"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		JackControl "HEADSETMIC Jack"
	}
}
