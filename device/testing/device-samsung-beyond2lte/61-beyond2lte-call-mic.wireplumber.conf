# Samsung Galaxy S10+ (beyond2lte): support for the echo-cancelled call mic
# (pipewire.conf.d/61-beyond2lte-call-mic.conf).
#
# 1. beyond2lte-call-mic-reference.lua links the Speaker sink monitor to the
#    echo reference only while beyond2lte.call-mic is running.
# 2. While linked, the internal mic (hw:S10,0) and the playback PCM (hw:S10,1)
#    share one driver. Both use 1024-frame ALSA periods; as a follower either PCM
#    resynced or overran every cycle with the default headroom. Tested
#    2026-11-19: mic as driver -> hw:S10,1 resync ~100/s; hw:S10,1 as driver
#    without headroom -> capture "mmap_commit Broken pipe" every cycle; hw:S10,1
#    as driver + 1024 frames headroom on both -> 0 xruns, 0 warnings. The driver
#    priority only matters when the two are in one graph (only while the call
#    mic is in use); the headroom adds about 21 ms latency to the speaker /
#    earpiece path and the internal mic.
wireplumber.components = [
  {
    name = beyond2lte-call-mic-reference.lua, type = script/lua
    provides = custom.beyond2lte-call-mic-reference
  }
]

wireplumber.profiles = {
  main = {
    custom.beyond2lte-call-mic-reference = required
  }
}

monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.hw_S10_1" } ]
    actions = {
      update-props = {
        api.alsa.headroom = 1024
        priority.driver   = 2100
      }
    }
  }
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Mic__source" } ]
    actions = {
      update-props = {
        api.alsa.headroom = 1024
      }
    }
  }
]
