# device-samsung-beyond2lte: suspend means deep sleep (exynos9820-suspend) only.
# systemd's default SuspendState is "mem standby freeze": when a deep suspend
# attempt fails (e.g. an early wakeup by the CP mailbox), systemd-sleep falls back
# to "freeze" = s2idle, which hangs this phone with the modem running (2026-11-20:
# frozen after a wake loop at weak signal).  With only "mem", a failed attempt just
# returns and beyond2lte-resuspend tries again.
# beyond2lte-usbc-sleep overrides MemorySleepMode with a /run drop-in while the phone
# powers a USB-C device (deep sleep hung with a dock there).
[Sleep]
SuspendState=mem
MemorySleepMode=deep
