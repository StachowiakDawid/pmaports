# max77705-usbc (USB-C/PD/MUIC driver) is validated (OTG attach + LimeSDR, kernel r9 with
# ds_init=31) and loads at boot since device-samsung-beyond2lte 3-r5; its options are in
# /usr/lib/modprobe.d (modprobe.conf of this package). usb-gadget-reconnect.service skips the
# userspace MUIC fix while the driver is bound. To go back to the userspace i2crw fallback
# (no host/OTG), uncomment:
#blacklist max77705_usbc
