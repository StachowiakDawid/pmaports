# Galaxy S10+: 1440x3040, 6.4" (~522 ppi). Scale 3 -> 480x1013 logical px,
# the same density Phosh targets on ~170 ppi reference hardware. Integer scale
# keeps text sharp; use 3.5 for a denser layout (fractional, slightly blurry).
# Unknown-1 = simpledrm (bootloader framebuffer, what runs today);
# DSI-1 = future exynos9820 DECON KMS driver.
[output:Unknown-1]
scale = 3

[output:DSI-1]
scale = 3
